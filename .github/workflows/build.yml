name: Build

on:
  push:
    branches:
      - '*/*'
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
        mongodb-version: ['7.0']
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # No version input: the exact version is read from package.json's packageManager field.
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      # The workflow provisions these itself, so the suites' own auto-start
      # (tests/global-setup.ts → scripts/test-infra.mjs, which exists so a local
      # `pnpm test` needs no manual docker command) must stay out of the way.
      # Same images and ports either way; this only decides who starts them.
      - name: Let CI own the test infrastructure
        run: echo "LT_TEST_INFRA=0" >> "$GITHUB_ENV"

      # Redis + S3 (RustFS) back the distributed-feature e2e tests (DEV-2985:
      # rate limiting, cron dedup, pubsub, S3 file storage). Plain docker runs —
      # both images boot in ~1s and need no auth setup beyond env vars. Each is
      # followed by a readiness wait so a slow start fails the job with a clear
      # message instead of an opaque connection error inside the test suite.
      - name: Start Redis
        # 6380 matches the local convention: 6379 is occupied by an auth-protected
        # TurboOps Redis on lt dev machines, so tests default to 6380 (no auth).
        run: docker run -d --name ci-redis -p 6380:6379 redis:7-alpine

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker exec ci-redis redis-cli ping 2>/dev/null)" = "PONG" ]; then
              echo "Redis ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Redis did not become ready within 30s"
          docker logs ci-redis
          exit 1

      - name: Start RustFS (S3)
        # Pinned to a concrete released tag (repo policy: fixed versions only).
        run: docker run -d --name ci-rustfs -p 9102:9000 -e RUSTFS_ROOT_USER=rustfs -e RUSTFS_ROOT_PASSWORD=rustfs-secret -e RUSTFS_VOLUMES=/data -e RUSTFS_OBS_LOGGER_LEVEL=warn rustfs/rustfs:1.0.0-rc.1 server /data

      - name: Wait for RustFS (S3)
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:9102; then
              echo "RustFS ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::RustFS did not become ready within 60s"
          docker logs ci-rustfs
          exit 1

      - name: Install dependencies
        run: pnpm install

      # The security `overrides:` block in pnpm-workspace.yaml is only ever validated by
      # `pnpm audit`, which otherwise runs solely in the maintainer-local `check` script — so a
      # regression (an override deleted, or one silently holding a package BELOW a newer patch)
      # would reach a release with a fully green pipeline. pnpm 11 uses the working bulk-advisory
      # endpoint; pnpm 10 and earlier hit the retired one and return HTTP 410.
      - name: Audit dependencies
        run: pnpm audit

      - name: Optimize and check
        run: pnpm run prepublishOnly

      # Compiles with SWC to CommonJS and loads every module under Node's CJS loader.
      # This is the ONLY step that can catch a temporal-dead-zone crash from an import
      # cycle: `nest build` uses tsc, and vitest runs SWC through Vite's module runner,
      # whose getter-based live bindings tolerate cycles. Consumers running
      # `nest start -b swc` do not get that safety net.
      # Builds into its own throwaway dir, so it cannot disturb the dist/ that Build
      # produces and Save build uploads.
      - name: SWC module-graph guard (TDZ)
        run: pnpm run check:swc-tdz

      - name: Build
        run: pnpm run build

      - name: Save build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: ./dist

  typecheck:
    name: Type-Check Tests
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # No version input: the exact version is read from package.json's packageManager field.
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Type-check the test suites (tests/ + src/**/*.spec.ts). `nest build`
      # (tsconfig.build.json) excludes tests + specs, and vitest runs through
      # unplugin-swc without type-checking — so spec type errors would land
      # unnoticed. Own job: needs no MongoDB / matrix, and stays off the build job.
      - name: Type-check test suites
        run: pnpm run typecheck:tests
