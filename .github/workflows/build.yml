name: Build

on:
  push:
    branches:
      - '*/*'
      - '*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
        mongodb-version: ['7.0']
    # Container names declared ONCE, then fed to both the composite action and the
    # teardown at the end of the job. The action accepts `redis-name`/`rustfs-name`
    # inputs, so a hardcoded `docker rm -f ci-redis ci-rustfs` silently stops
    # removing anything the moment someone passes different names — and a leftover
    # container fails the NEXT job on a name conflict, on a self-hosted runner.
    env:
      REDIS_CONTAINER: ci-redis
      RUSTFS_CONTAINER: ci-rustfs
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # No version input: the exact version is read from package.json's packageManager field.
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      # Redis + S3 (RustFS) back the distributed-feature e2e tests (DEV-2985:
      # rate limiting, cron dedup, pubsub, S3 file storage). Shared with
      # publish.yml via a composite action so the two paths cannot drift.
      - name: Start test infrastructure (Redis + S3)
        uses: ./.github/actions/test-infra
        with:
          redis-name: ${{ env.REDIS_CONTAINER }}
          rustfs-name: ${{ env.RUSTFS_CONTAINER }}

      - name: Install dependencies
        run: pnpm install

      # The security `overrides:` block in pnpm-workspace.yaml is only ever validated by
      # `pnpm audit`, which otherwise runs solely in the maintainer-local `check` script — so a
      # regression (an override deleted, or one silently holding a package BELOW a newer patch)
      # would reach a release with a fully green pipeline. pnpm 11 uses the working bulk-advisory
      # endpoint; pnpm 10 and earlier hit the retired one and return HTTP 410.
      - name: Audit dependencies
        run: pnpm audit

      # `pnpm audit` above reports advisories. What it cannot say is that a supposed remedy for
      # one is already sitting in pnpm-workspace.yaml with its target BELOW the fix line — which
      # is precisely the regression the comment above worries about, now automated.
      #
      # The report is captured and handed over with --audit-file rather than letting the guard
      # run its own audit. It saves a second network round trip, but the load-bearing reason is
      # different: the guard EXITS 0 when it cannot obtain a report, which is right for an
      # offline laptop and wrong for a runner, where the step would go green having verified
      # nothing. With an explicit --audit-file, an unreadable report hard-fails instead.
      # `|| true` is on the capture only — `pnpm audit` exits non-zero whenever it finds
      # anything, and the gate for that is the step above, not this one.
      - name: Capture audit report
        run: pnpm audit --json > audit.json || true

      - name: Security overrides + suppressions guard
        # GITHUB_TOKEN raises the Advisory API quota from 60/hour per IP (shared across every
        # repo on a hosted runner) to 1000/hour for this repository. Without it a neighbour's
        # traffic could exhaust the quota and fail this step, which would read as a security
        # finding rather than the quota problem it is.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-overrides.mjs --audit-file audit.json

      # Unmet or missing peers are a lockfile-level defect that no other step here would notice.
      - name: Peer dependency consistency
        run: pnpm peers check

      - name: Optimize and check
        run: pnpm run prepublishOnly

      # Compiles with SWC to CommonJS and loads every module under Node's CJS loader.
      # This is the ONLY step that can catch a temporal-dead-zone crash from an import
      # cycle: `nest build` uses tsc, and vitest runs SWC through Vite's module runner,
      # whose getter-based live bindings tolerate cycles. Consumers running
      # `nest start -b swc` do not get that safety net.
      # Builds into its own throwaway dir, so it cannot disturb the dist/ that Build
      # produces and Save build uploads.
      - name: SWC module-graph guard (TDZ)
        run: pnpm run check:swc-tdz

      - name: Build
        run: pnpm run build

      - name: Save build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: ./dist

      # A hosted runner is thrown away after the job, so this is a no-op there.
      # It matters on a self-hosted runner, where a leftover `ci-redis` makes the
      # NEXT job fail on a name conflict before a single test runs.
      # `if: always()` so a failed job cleans up too.
      - name: Remove test infrastructure
        if: always()
        run: docker rm -f "$REDIS_CONTAINER" "$RUSTFS_CONTAINER" 2>/dev/null || true

  typecheck:
    name: Type-Check Tests
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # No version input: the exact version is read from package.json's packageManager field.
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Type-check the test suites (tests/ + src/**/*.spec.ts). `nest build`
      # (tsconfig.build.json) excludes tests + specs, and vitest runs through
      # unplugin-swc without type-checking — so spec type errors would land
      # unnoticed. Own job: needs no MongoDB / matrix, and stays off the build job.
      - name: Type-check test suites
        run: pnpm run typecheck:tests
