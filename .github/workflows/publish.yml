name: Publish

on:
  release:
    types:
      - released

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 24.x ]
        mongodb-version: [ '7.0' ]
    # Container names declared ONCE, then fed to both the composite action and the
    # teardown at the end of the job. The action accepts `redis-name`/`rustfs-name`
    # inputs, so a hardcoded `docker rm -f ci-redis ci-rustfs` silently stops
    # removing anything the moment someone passes different names — and a leftover
    # container fails the NEXT job on a name conflict, on a self-hosted runner.
    env:
      REDIS_CONTAINER: ci-redis
      RUSTFS_CONTAINER: ci-rustfs
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # No version input: the exact version is read from package.json's packageManager field.
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      # Redis + S3 (RustFS) back the distributed-feature e2e tests (DEV-2985:
      # rate limiting, cron dedup, pubsub, S3 file storage). Shared with
      # build.yml via a composite action so the two paths cannot drift.
      - name: Start test infrastructure (Redis + S3)
        uses: ./.github/actions/test-infra
        with:
          redis-name: ${{ env.REDIS_CONTAINER }}
          rustfs-name: ${{ env.RUSTFS_CONTAINER }}

      - name: Install dependencies
        run: pnpm install

      # Same gate as build.yml, and NOT redundant with it. This workflow triggers on
      # `release: released` — a different event, so it cannot `needs:` a job in the
      # push-triggered build workflow, and the release itself may be cut days after
      # the commit was last built. `pnpm audit` is time-dependent by nature: a new
      # advisory published in between would make the release the first shipping
      # artifact nobody audited. It is also the ONLY check that validates the
      # `overrides:` block in pnpm-workspace.yaml — an override deleted, or silently
      # holding a package BELOW a newer patch, is invisible to every other step.
      - name: Audit dependencies
        run: pnpm audit

      # See build.yml for the reasoning. On the publish path it matters more, not less: this is
      # the last gate before a release, and an override that silently pins a package BELOW its
      # advisory's fix line looks exactly like a security fix in the diff.
      - name: Capture audit report
        run: pnpm audit --json > audit.json || true

      - name: Security overrides + suppressions guard
        # GITHUB_TOKEN raises the Advisory API quota from 60/hour per IP (shared across every
        # repo on a hosted runner) to 1000/hour for this repository. Without it a neighbour's
        # traffic could exhaust the quota and fail this step, which would read as a security
        # finding rather than the quota problem it is.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-overrides.mjs --audit-file audit.json

      - name: Peer dependency consistency
        run: pnpm peers check

      - name: Optimize and check
        run: pnpm run prepublishOnly

      # Compiles with SWC to CommonJS and loads every module under Node's CJS loader.
      # This is the ONLY step that can catch a temporal-dead-zone crash from an import
      # cycle: `nest build` uses tsc, and vitest runs SWC through Vite's module runner,
      # whose getter-based live bindings tolerate cycles. Consumers running
      # `nest start -b swc` do not get that safety net — which is exactly why this
      # belongs on the PUBLISH path and not only on the build path: the failure mode
      # it catches only ever hits a consumer, and only after the package has shipped.
      # Builds into its own throwaway dir, so it cannot disturb the published dist/.
      - name: SWC module-graph guard (TDZ)
        run: pnpm run check:swc-tdz

      # NOTE: the regression-evidence gate used to run HERE, and moved to its own parallel job
      # (see `regression-evidence` below). It cost ~13 of this job's ~18 minutes while blocking
      # every release behind it. It now runs alongside the publish instead of in front of it.

      - name: Build
        run: pnpm run build

      # The starter is the first REAL consumer, and until this step existed it only ever saw a
      # release AFTER it was published — which is where both 11.33.0's and 11.33.1's defects were
      # actually found, hours late, by a human. Everything above validates this repo against
      # `src/server`, a consumer that tracks every framework change in the same commit and imports
      # `src/` by relative path. The starter does neither: it subclasses the shipped `Core*` classes
      # and consumes `dist/` through the package's public entry points. A signature that only a
      # SUBCLASS notices, a `files` mistake that drops something from the tarball, or a
      # devDependency used at runtime by framework code is invisible to every step above and fails
      # here.
      #
      # Checked out here rather than assumed present: a hosted runner has nothing but this repo.
      - name: Check out the consumer project (nest-server-starter)
        uses: actions/checkout@v7
        with:
          path: consumer/nest-server-starter
          repository: lenneTech/nest-server-starter

      # `--fast` = the consumer's typecheck + build + full test suite. Deliberately NOT the
      # starter's whole `check`: that also runs the starter's own `pnpm audit`, `format:check` and
      # `lint`, none of which say anything about OUR tarball — and a fresh advisory in one of the
      # starter's own dependencies would then block an unrelated release. Those belong to the
      # starter's own CI. Run the full chain locally with `pnpm run check:consumer`.
      - name: Consumer gate (install the tarball into the starter and run its tests)
        run: node scripts/check-consumer.mjs --fast --starter="$GITHUB_WORKSPACE/consumer/nest-server-starter"

      - uses: JS-DevTools/npm-publish@v4
        with:
          access: public
          token: ${{ secrets.NPM_TOKEN }}

      # A hosted runner is thrown away after the job, so this is a no-op there.
      # It matters on a self-hosted runner, where a leftover `ci-redis` makes the
      # NEXT job fail on a name conflict before a single test runs.
      # `if: always()` so a failed job cleans up too.
      - name: Remove test infrastructure
        if: always()
        run: docker rm -f "$REDIS_CONTAINER" "$RUSTFS_CONTAINER" 2>/dev/null || true

  # ---------------------------------------------------------------------------------------------
  # Regression evidence — runs ALONGSIDE the publish, and deliberately does not block it.
  #
  # WHAT IT CHECKS, and why that justifies the unusual arrangement: it re-applies every mutation in
  # tests/regression-mutations.json and REQUIRES the specs that claim to catch that defect to go
  # red. It does not test the product — the `publish` job does that, in full, and still gates the
  # release. This job tests the TESTS: a regression test that has gone vacuous is green, and a
  # green test looks identical whether it checks something or nothing. Two tests written while
  # fixing 11.33.1 passed with the defect fully restored, and 11.37.0 shipped a mutation whose
  # spec list silently dropped the only spec that could observe it.
  #
  # WHY IT NO LONGER BLOCKS: it costs ~13 minutes against the publish job's ~5, so every release
  # waited on it. What it protects is the FRESHNESS OF THE SAFETY NET, not the correctness of the
  # artifact — a vacuous regression test does not make the published package wrong, it makes a
  # future regression harder to catch. That is worth fixing promptly; it is not worth holding
  # every release hostage. So the package ships on the `publish` job's own gates, and this job
  # reports independently.
  #
  # HOW A FAILURE IS SEEN — three ways, none of which rely on someone watching a log:
  #   1. The workflow run is marked failed (the publish itself has already happened).
  #   2. A GitHub issue is opened automatically, labelled `regression-evidence`.
  #   3. `/lt-dev:publish` checks this job's last conclusion BEFORE starting a new release and
  #      refuses to proceed silently past a red one.
  # Remove any of the three and this becomes a job nobody reads.
  regression-evidence:
    name: Regression evidence (non-blocking)
    runs-on: ubuntu-latest
    # No `needs:` — this is the point. It starts with the publish job, not after it.
    strategy:
      matrix:
        node-version: [ 24.x ]
        mongodb-version: [ '7.0' ]
    env:
      REDIS_CONTAINER: evidence-redis
      RUSTFS_CONTAINER: evidence-rustfs
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      # Own container names: this job runs CONCURRENTLY with `publish`, and on a self-hosted
      # runner the two would otherwise collide on `ci-redis` / `ci-rustfs`.
      - name: Start test infrastructure (Redis + S3)
        uses: ./.github/actions/test-infra
        with:
          redis-name: ${{ env.REDIS_CONTAINER }}
          rustfs-name: ${{ env.RUSTFS_CONTAINER }}

      - name: Install dependencies
        run: pnpm install

      - name: Regression evidence (mutation check)
        id: evidence
        run: pnpm run check:mutations

      # Opens an issue when the gate goes red. Without this, a red run is only noticed at the NEXT
      # release — which may be weeks away, and the whole point is that nobody has to watch.
      # `if: failure()` covers a crashed run too, which is itself a finding: an INCONCLUSIVE gate
      # proves nothing about the evidence.
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const release = context.payload.release?.tag_name ?? context.sha.slice(0, 8);
            const title = `Regression evidence failed for ${release}`;
            const body = [
              `The regression-evidence gate failed while publishing **${release}**.`,
              '',
              `**The package was published** — this job does not block the release. What failed is the`,
              'evidence behind the regression tests, not the product: one or more mutations no longer',
              'turn their specs red, which means those tests may be checking nothing.',
              '',
              `Run: ${run}`,
              '',
              '### What to do',
              '',
              '1. Read which mutation failed. `FAIL … stayed GREEN` means a vacuous test;',
              '   `INCONCLUSIVE` means the run crashed and proved nothing either way.',
              '2. Reproduce locally: `pnpm run check:mutations -- --id=<mutation-id>`',
              '3. Either repair the test so it observes the defect again, or re-point the mutation if',
              '   the defect is no longer reachable. Both are real outcomes; silently deleting the',
              '   mutation is not.',
              '',
              'This issue is opened automatically. `/lt-dev:publish` also refuses to start a new release',
              'while the last run of this job is red, so it cannot be missed on the next release either.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'regression-evidence',
            });
            if (existing.data.some((issue) => issue.title === title)) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['regression-evidence'],
            });

      - name: Remove test infrastructure
        if: always()
        run: docker rm -f "$REDIS_CONTAINER" "$RUSTFS_CONTAINER" 2>/dev/null || true
