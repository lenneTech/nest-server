name: Publish

on:
  release:
    types:
      - released

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 24.x ]
        mongodb-version: [ '7.0' ]
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # No version input: the exact version is read from package.json's packageManager field.
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      # Redis + S3 (RustFS) back the distributed-feature e2e tests (DEV-2985)
      - name: Start Redis
        # 6380 matches the local convention: 6379 is occupied by an auth-protected
        # TurboOps Redis on lt dev machines, so tests default to 6380 (no auth).
        run: docker run -d --name ci-redis -p 6380:6379 redis:7-alpine

      - name: Start RustFS (S3)
        run: docker run -d --name ci-rustfs -p 9102:9000 -e RUSTFS_ROOT_USER=rustfs -e RUSTFS_ROOT_PASSWORD=rustfs-secret -e RUSTFS_VOLUMES=/data -e RUSTFS_OBS_LOGGER_LEVEL=warn rustfs/rustfs:latest server /data

      - name: Install dependencies
        run: pnpm install

      - name: Optimize and check
        run: pnpm run prepublishOnly

      - name: Build
        run: pnpm run build

      - uses: JS-DevTools/npm-publish@v4
        with:
          access: public
          token: ${{ secrets.NPM_TOKEN }}
