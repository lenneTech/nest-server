name: Publish

on:
  release:
    types:
      - released

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 24.x ]
        mongodb-version: [ '7.0' ]
    # Container names declared ONCE, then fed to both the composite action and the
    # teardown at the end of the job. The action accepts `redis-name`/`rustfs-name`
    # inputs, so a hardcoded `docker rm -f ci-redis ci-rustfs` silently stops
    # removing anything the moment someone passes different names — and a leftover
    # container fails the NEXT job on a name conflict, on a self-hosted runner.
    env:
      REDIS_CONTAINER: ci-redis
      RUSTFS_CONTAINER: ci-rustfs
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        # No version input: the exact version is read from package.json's packageManager field.
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      # Redis + S3 (RustFS) back the distributed-feature e2e tests (DEV-2985:
      # rate limiting, cron dedup, pubsub, S3 file storage). Shared with
      # build.yml via a composite action so the two paths cannot drift.
      - name: Start test infrastructure (Redis + S3)
        uses: ./.github/actions/test-infra
        with:
          redis-name: ${{ env.REDIS_CONTAINER }}
          rustfs-name: ${{ env.RUSTFS_CONTAINER }}

      - name: Install dependencies
        run: pnpm install

      # Same gate as build.yml, and NOT redundant with it. This workflow triggers on
      # `release: released` — a different event, so it cannot `needs:` a job in the
      # push-triggered build workflow, and the release itself may be cut days after
      # the commit was last built. `pnpm audit` is time-dependent by nature: a new
      # advisory published in between would make the release the first shipping
      # artifact nobody audited. It is also the ONLY check that validates the
      # `overrides:` block in pnpm-workspace.yaml — an override deleted, or silently
      # holding a package BELOW a newer patch, is invisible to every other step.
      - name: Audit dependencies
        run: pnpm audit

      - name: Optimize and check
        run: pnpm run prepublishOnly

      # Compiles with SWC to CommonJS and loads every module under Node's CJS loader.
      # This is the ONLY step that can catch a temporal-dead-zone crash from an import
      # cycle: `nest build` uses tsc, and vitest runs SWC through Vite's module runner,
      # whose getter-based live bindings tolerate cycles. Consumers running
      # `nest start -b swc` do not get that safety net — which is exactly why this
      # belongs on the PUBLISH path and not only on the build path: the failure mode
      # it catches only ever hits a consumer, and only after the package has shipped.
      # Builds into its own throwaway dir, so it cannot disturb the published dist/.
      - name: SWC module-graph guard (TDZ)
        run: pnpm run check:swc-tdz

      # Re-runs the evidence behind every `@regression` test: applies each mutation registered in
      # tests/regression-mutations.json and REQUIRES the specs that claim to catch it to go red.
      #
      # Not redundant with the test run above, which proves the suite is GREEN. Green is exactly
      # what a vacuous test also is — and two regression tests written while fixing 11.33.1 passed
      # with the defect fully restored. This is the only step that can tell the two apart. It
      # belongs on the publish path rather than on every push because it edits source and re-runs
      # whole e2e suites; a CI checkout is clean, so the working-tree guard is satisfied.
      - name: Regression evidence (mutation check)
        run: pnpm run check:mutations

      - name: Build
        run: pnpm run build

      # The starter is the first REAL consumer, and until this step existed it only ever saw a
      # release AFTER it was published — which is where both 11.33.0's and 11.33.1's defects were
      # actually found, hours late, by a human. Everything above validates this repo against
      # `src/server`, a consumer that tracks every framework change in the same commit and imports
      # `src/` by relative path. The starter does neither: it subclasses the shipped `Core*` classes
      # and consumes `dist/` through the package's public entry points. A signature that only a
      # SUBCLASS notices, a `files` mistake that drops something from the tarball, or a
      # devDependency used at runtime by framework code is invisible to every step above and fails
      # here.
      #
      # Checked out here rather than assumed present: a hosted runner has nothing but this repo.
      - name: Check out the consumer project (nest-server-starter)
        uses: actions/checkout@v7
        with:
          path: consumer/nest-server-starter
          repository: lenneTech/nest-server-starter

      # `--fast` = the consumer's typecheck + build + full test suite. Deliberately NOT the
      # starter's whole `check`: that also runs the starter's own `pnpm audit`, `format:check` and
      # `lint`, none of which say anything about OUR tarball — and a fresh advisory in one of the
      # starter's own dependencies would then block an unrelated release. Those belong to the
      # starter's own CI. Run the full chain locally with `pnpm run check:consumer`.
      - name: Consumer gate (install the tarball into the starter and run its tests)
        run: node scripts/check-consumer.mjs --fast --starter="$GITHUB_WORKSPACE/consumer/nest-server-starter"

      - uses: JS-DevTools/npm-publish@v4
        with:
          access: public
          token: ${{ secrets.NPM_TOKEN }}

      # A hosted runner is thrown away after the job, so this is a no-op there.
      # It matters on a self-hosted runner, where a leftover `ci-redis` makes the
      # NEXT job fail on a name conflict before a single test runs.
      # `if: always()` so a failed job cleans up too.
      - name: Remove test infrastructure
        if: always()
        run: docker rm -f "$REDIS_CONTAINER" "$RUSTFS_CONTAINER" 2>/dev/null || true
