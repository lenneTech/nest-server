# pnpm settings (single source of truth).
# pnpm 11 no longer reads the "pnpm" field in package.json, and .npmrc is auth/registry only
# (https://pnpm.io/blog/releases/11.0). Everything pnpm-specific lives here.

# Migrated from .npmrc (pnpm 11 no longer reads these from .npmrc):
nodeLinker: hoisted
autoInstallPeers: false
strictPeerDependencies: false

# Packages allowed to run install scripts (native builds). pnpm 11 merges the old
# onlyBuiltDependencies/neverBuiltDependencies into this single allowBuilds map.
allowBuilds:
  'bcrypt': true
  '@swc/core': true
  'esbuild': true
  '@nestjs/core': true
  '@compodoc/compodoc': true
  '@apollo/protobufjs': true
  '@scarf/scarf': false
  # Optional native accelerator for msgpackr (via bullmq); pure-JS fallback works fine.
  'msgpackr-extract': false

# ----------------------------------------------------------------------------------
# Advisories we knowingly do NOT fix, with the reason. `pnpm audit` treats these as
# resolved, so the CI gate stays meaningful for everything else.
# Rules for adding one: name the advisory, say why it cannot be fixed, say why the
# residual risk is acceptable, and date the verification. If you cannot write those
# three sentences honestly, fix the dependency instead.
# ----------------------------------------------------------------------------------
auditConfig:
  ignoreGhsas:
    # brace-expansion DoS via unbounded expansion (HIGH). Patched ONLY in 5.0.8 — verified
    # 2026-07-28 that neither 1.1.16 nor 2.1.2 contains a length guard, so there is no 1.x
    # backport to move to. After the `minimatch@>=5.0.0 <10.2.6 -> 10.2.6` override above
    # (10.2.6 requests the patched ^5.0.8) exactly ONE path remains:
    #   @nestjs/cli > fork-ts-checker-webpack-plugin > minimatch@3 > brace-expansion@1
    # Not fixable: fork-ts-checker calls `__importDefault(require('minimatch')).default(...)`.
    # minimatch@10 sets `__esModule: true` without a `.default`, so substituting it throws
    # "minimatch_1.default is not a function"; forcing brace-expansion@5.0.8 under minimatch@3
    # throws "expand is not a function". Both reproduced 2026-07-28.
    # Residual accepted: dev-only build tooling, running on a developer machine or CI runner
    # over repo-local input. It is not a dependency of the published package (`files` ships
    # dist + docs only), so no consumer and no runtime ever reaches this code.
    # Re-verify when @nestjs/cli drops fork-ts-checker-webpack-plugin — then delete this entry.
    # Verified 2026-07-28 (DEV-2698).
    - GHSA-mh99-v99m-4gvg

peerDependencyRules:
  allowedVersions:
    '@apollo/server': '5'
    '@types/express': '5'
  ignoreMissing:
    - '@egjs/hammerjs'
    - 'keycharm'
    - 'vis-data'
    - 'vis-util'

# Security overrides: force vulnerable transitive deps onto patched versions.
#
# WARNING — these do NOT reach consumers of the published package. `overrides:` is honoured only
# for the ROOT project of an install, so a downstream project gets ITS OWN overrides, not these.
# A green `pnpm audit` here says nothing about a consumer's tree. The load-bearing entries are
# therefore mirrored in nest-server-starter and lt-monorepo, and documented for hand-rolled setups
# in docs/security-overrides.md (which ships, because `docs/**` is in package.json `files`).
#
# Last verified 2026-07-22 by resolving a lockfile with this block stripped:
#   LOAD-BEARING - removing them reintroduces a vulnerable version:
#     ws                 -> regresses to 8.20.1 (@nestjs/graphql pins it EXACTLY, so it cannot
#                           resolve forward on its own)
#     @hono/node-server  -> regresses to 1.19.14
#   INERT today - each already resolves to a patched version without help. Kept only as a pin, so
#   each one silently becomes a DOWNGRADE-LOCK the moment a newer patch ships upstream. Re-check
#   every maintenance run and drop what is no longer needed:
#     axios, brace-expansion x3, js-yaml, fast-uri, body-parser
#
# Every target MUST be a fixed version, never an unbounded range - see
# .claude/rules/package-management.md for the incident that rule exists to prevent.
# pnpm 11 `pnpm audit` is the safety net for regressions.
overrides:
  # Security: Memory exhaustion DoS + uninitialized memory disclosure (GHSA-96hv-2xvq-fx4p, high, patched >=8.21.0) - transitive via @nestjs/graphql>ws and @nestjs/graphql>graphql-ws>ws (resolves to vulnerable 8.20.1 without this)
  # LOAD-BEARING. Remove once @nestjs/graphql stops pinning ws 8.20.1 exactly.
  # Target raised 8.21.1 -> 8.21.3 on 2026-08-10 to match the direct `ws` dependency: with
  # nodeLinker: hoisted a lower target would leave a SECOND, older ws copy in the tree next to
  # the direct one. Keep the two in lockstep whenever the direct dependency moves.
  'ws@>=8.0.0 <8.21.0': '8.21.3'
  # Security: Axios formDataToJSON recursion DoS + prototype pollution in auth subfields (3x moderate, patched >=1.18.0) - transitive via node-mailjet>axios (@getbrevo/brevo dropped all runtime deps in v6)
  # Inert today (axios already resolves >=1.18.0). Remove once node-mailjet requests >=1.18.0 itself.
  'axios@<1.18.0': '1.18.1'
  # Security: brace-expansion DoS - two advisories. GHSA-3jxr-9vmj-r5cp (exponential-time expansion of
  # consecutive non-expanding {} groups) and GHSA-mh99-v99m-4gvg (unbounded expansion length -> OOM,
  # patched ONLY in 5.0.8; verified 2026-07-28 that 1.1.16 and 2.1.2 carry no length guard at all).
  # One entry per affected major, each a patch bump INSIDE that major.
  # v5 (prod): ts-morph>@ts-morph/common>minimatch, directly and via @nestjs/graphql + @nestjs/apollo. v2/v1 (dev only): @nestjs/cli + @swc/cli > minimatch, @nestjs/cli>fork-ts-checker-webpack-plugin>minimatch.
  # The v5 key is floored at >=5.0.0 on purpose: a wider `>=3.0.0` would ALSO match a future 3.x/4.x
  # dependency and silently force it across two majors - which is not what "patch bump" means.
  # Inert today (all three resolve patched). Remove once minimatch requests the patched ranges.
  'brace-expansion@>=5.0.0 <5.0.9': '5.0.9'
  # The 2.x line no longer resolves at all since the minimatch lift below removed its only parent.
  # Kept anyway, and deliberately: it is not inert because the dependency was fixed, but because
  # ANOTHER override happens to hide it. Drop the minimatch entry and 2.x returns immediately, so
  # deleting this one would couple two unrelated lines. Remove it once minimatch@9 is gone for good.
  'brace-expansion@>=2.0.0 <2.1.2': '2.1.2'
  'brace-expansion@<1.1.18': '1.1.18'
  # Security: the real lever for GHSA-mh99-v99m-4gvg. Only brace-expansion 5.0.8 carries the fix, and
  # forcing it onto a minimatch@3 consumer throws "expand is not a function" (5.x exports a namespace
  # object, not a callable). minimatch 10.2.6 REQUESTS ^5.0.8, so lifting every 9.x consumer onto it
  # removes the vulnerable 2.x line from the tree legitimately.
  # Floored at >=9.0.0, NOT >=5.0.0: only 9 and 10 share the non-callable CJS export shape. Verified
  # 2026-07-30 that majors 5-8 export a CALLABLE function (5.1.6: `typeof m === 'function'`; 6-8 add a
  # `.default`), so forcing them onto 10 would throw the very "is not a function" documented below as
  # the reason minimatch@3 is excluded. Nothing resolves in 5-8 today, so the wider floor was latent
  # rather than broken - but it pre-authorized exactly the break it warns about.
  # minimatch@3 is deliberately NOT matched - see auditConfig above.
  'minimatch@>=9.0.0 <10.2.6': '10.2.6'
  # Security: js-yaml quadratic CPU consumption via YAML merge-key chains (GHSA-52cp-r559-cp3m, high, patched >=4.3.0) - dev only, transitive via @compodoc/compodoc>cosmiconfig and @nestjs/cli>fork-ts-checker-webpack-plugin>cosmiconfig
  # Inert today. Remove once cosmiconfig requests >=4.3.0.
  'js-yaml@>=4.0.0 <4.3.1': '4.3.1'
  # Security: js-yaml exponential parsing time in flow collections (GHSA-pm4m-ph32-ghv5, high, patched >=5.2.2) - transitive via @nestjs/swagger>js-yaml. Separate line from the 4.x entry above: same package, different major.
  'js-yaml@>=5.0.0 <5.2.2': '5.2.2'
  # Security: fast-uri host confusion via failed IDN canonicalization (GHSA-v2hh-gcrm-f6hx, high, patched >=3.1.3) and via literal backslash authority delimiter (high, patched >=3.1.4) - transitive via @modelcontextprotocol/sdk>ajv and @modelcontextprotocol/sdk>ajv-formats>ajv
  # Inert today. Remove once ajv / ajv-formats request >=3.1.4.
  'fast-uri@>=3.0.0 <3.1.5': '3.1.5'
  # Security: ip-address ReDoS + parser confusion (high + moderate, patched >=10.3.1) - dev/transitive
  # via @modelcontextprotocol/sdk>express-rate-limit>ip-address.
  # Remove once express-rate-limit requests >=10.3.1.
  'ip-address@<10.3.1': '10.3.1'
  # Security: nanoid predictable output with a non-integer size (high, patched >=3.3.17) - dev only,
  # transitive via better-auth>vitest>vite>postcss>nanoid. Separate line per major: 5.x is unaffected.
  # Remove once postcss requests >=3.3.17.
  'nanoid@>=3.0.0 <3.3.17': '3.3.17'
  # Security: postcss parsing DoS (moderate, patched >=8.5.23) - dev only, transitive via
  # better-auth>vitest>vite>postcss. Remove once vite requests >=8.5.23.
  'postcss@<8.5.23': '8.5.23'
  # Security: undici request smuggling / header handling (moderate, patched >=7.29.0) - dev only,
  # transitive via @compodoc/compodoc>cheerio>undici. Remove once cheerio requests >=7.29.0.
  'undici@>=7.0.0 <7.29.0': '7.29.0'
  # Security: hono path handling + body-limit bypass (moderate + low, patched >=4.12.34) - transitive
  # via @modelcontextprotocol/sdk>hono and >@hono/node-server>hono. Floored at >=4.0.0 so the entry
  # stays a patch bump inside major 4 and cannot drag a future 5.x across a major (see the note above
  # about the earlier hard-pin form of this entry). Remove once the SDK requests >=4.12.34.
  'hono@>=4.0.0 <4.12.34': '4.12.34'
  # Security: body-parser DoS on malformed urlencoded input (GHSA-v422-hmwv-36x6, low, patched >=2.3.0) - transitive via @apollo/server, @as-integrations/express5 and express itself (22 paths)
  # Inert today. Remove once express / @apollo/server request >=2.3.0.
  'body-parser@>=2.0.0 <2.3.0': '2.3.0'
  # NOTE: there is deliberately NO `hono` override.
  # The 3 moderate Hono advisories (GHSA-xgm2-5f3f-mvvc, GHSA-hvrm-45r6-mjfj, GHSA-w62v-xxxg-mg59)
  # are patched in >=4.12.27, and @modelcontextprotocol/sdk's `^4.11.4` resolves to 4.12.31 on its
  # own. A `hono@>=4.0.0 <4.12.27` -> `4.12.27` entry looked harmless but was a HARD PIN: pnpm
  # replaces the whole matched spec with the target, so it dragged hono BACK four patch releases and
  # would silently reintroduce anything fixed in 4.12.28-4.12.31. Do not re-add it.
  # Security: @hono/node-server path traversal in the static-file handler (GHSA-frvp-7c67-39w9, patched >=2.0.5) plus an unauthenticated memory leak in the 2.x line itself (GHSA-9mqv-5hh9-4cgg, patched >=2.0.10); both moderate.
  # Transitive via @modelcontextprotocol/sdk, which declares ^1.19.9 and ships NO 1.x fix line, so this is deliberately a cross-major override.
  # Verified safe: the SDK's only consumed symbol is `getRequestListener` (server/streamableHttp.js, loaded by core-ai-mcp.controller.ts), unchanged in 2.x as `(fetchCallback, options?)` and confirmed present at runtime. Engines `>=20` fit this package's `>= 22`, peer `hono@^4` is satisfied by the resolved 4.12.31.
  # LOAD-BEARING. Drop this entry as soon as @modelcontextprotocol/sdk moves its own range to ^2.
  '@hono/node-server@<2.0.10': '2.0.11'

# NOTE (2026-08-10): `minimumReleaseAge` itself is NOT set anywhere - not here, not in .npmrc,
# not in a global pnpm config - and pnpm defaults it to 0 (`minimumReleaseAge = opts.minimumReleaseAge ?? 0`).
# The exclusions below therefore currently exclude packages from a hold-back that is not active,
# i.e. the whole list is inert. Either set `minimumReleaseAge` (in minutes) to turn the
# supply-chain hold-back on and make these entries meaningful, or drop the list. Until then,
# "recently published" has to be judged by hand during maintenance runs.
minimumReleaseAgeExclude:
  # Bumped 3.1105.0 -> 3.1106.0 alongside the devDependency; the AWS SDK publishes almost daily,
  # so this pair always trips a hold-back and the pinned version has to be carried along.
  - '@aws-sdk/client-s3@3.1106.0'
  - '@aws-sdk/s3-request-presigner@3.1106.0'
  - bullmq@6.0.9
  - '@nestjs/common@11.1.29'
  - '@nestjs/core@11.1.29'
  - '@nestjs/platform-express@11.1.29'
