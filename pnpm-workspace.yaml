# pnpm settings (single source of truth).
# pnpm 11 no longer reads the "pnpm" field in package.json, and .npmrc is auth/registry only
# (https://pnpm.io/blog/releases/11.0). Everything pnpm-specific lives here.
#
# Every entry below must still DO something. When an entry stops changing the resolved tree, it goes,
# together with its comment — git keeps the history. The rules for overrides and suppressions, and the
# incidents behind them, live in .claude/rules/package-management.md.

nodeLinker: hoisted
autoInstallPeers: false
strictPeerDependencies: false

# Every package in the tree that has an install script, classified. An unclassified one makes
# `pnpm install` fail with ERR_PNPM_IGNORED_BUILDS. Re-check when the tree changes: an entry for a
# package without an install script is dead (as @nestjs/core and @compodoc/compodoc became in 12.0.0).
allowBuilds:
  'bcrypt': true
  '@swc/core': true
  'esbuild': true
  '@apollo/protobufjs': true
  # Telemetry.
  '@scarf/scarf': false
  # Optional native accelerator for msgpackr (via bullmq); the pure-JS fallback works fine.
  'msgpackr-extract': false

# Advisories knowingly not fixed. EMPTY on purpose, and written as `[]` so `check:overrides` reads it
# as a decision rather than as a parse failure. A suppression is the last resort, for an advisory with
# no patched version anywhere: name the advisory, why it cannot be fixed, why the residual risk is
# acceptable, and date the verification. `check:overrides` re-checks every listed GHSA against the
# GitHub Advisory API on each run and fails once a fix exists or the advisory is withdrawn.
# Suppressions — the last resort, each with the fix that exists and why it cannot be used. `check:overrides` re-tests
# every entry on every run (consumer versions, a backported fix, an undeclared consumer) and fails once one stops
# holding; see .claude/rules/package-management.md ("Suppressions age the same way").
#
# GHSA-g3hv-75wg-m249 (minimatch < 11.0.1, moderate, DoS through globparts amplification) and
# GHSA-3g3m-2fjr-6pw4 (glob 9 – 14.0.1, moderate, AbortSignal cancellation bypass). Verified 2026-10-31 (owner decision,
# DEV-3899): both fixes exist only in new majors (minimatch 11.0.1, glob 14.0.2, released 2026-10-27), and every
# consumer is on its newest release without them — @nestjs/cli 12.0.11 pins minimatch 10.2.6 exactly, @ts-morph/common
# 0.29.0 (via ts-morph 28.0.0, the Permissions module's scanner) and nodemon 3.1.14 need ^10, @swc/cli 0.8.2 needs ^9,
# glob 13.0.6 (via rimraf 6.1.3, which needs glob ^13) needs ^10. An override across the major is ruled out by the
# fixed-target rule, and minimatch 11 removed `makeRe()` and `Minimatch#regexp`. Every path matches patterns the
# DEVELOPER writes (tsconfig and scanner globs, CLI file arguments, cleanup paths), never request input.
# Re-verify when any of these consumers releases a version on minimatch 11 / glob 14 — the guard reports it as RE-TEST.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
    - GHSA-3g3m-2fjr-6pw4
  unusableFixConsumers:
    GHSA-g3hv-75wg-m249: '@nestjs/cli@12.0.11 + @swc/cli@0.8.2 + @ts-morph/common@0.29.0 + glob@13.0.6 + nodemon@3.1.14 cannot use 11.0.1'
    GHSA-3g3m-2fjr-6pw4: 'rimraf@6.1.3 cannot use 14.0.2'

peerDependencyRules:
  allowedVersions:
    # typeorm 1.1.2 declares the OPTIONAL peer `ioredis: ^5.0.4` for its own Redis query-result cache, which
    # the framework never enables (the SQL store compiles its own queries and caches nothing in TypeORM).
    # This repo is on ioredis 6 for CoreRedisService. Parent-scoped, so no other consumer of ioredis is
    # affected. Remove once typeorm's peer range includes 6.
    'typeorm>ioredis': '6'
  # vis-network (via @compodoc/compodoc) declares peers compodoc never installs; without this,
  # `pnpm peers check` reports four missing peers on every run.
  ignoreMissing:
    - '@egjs/hammerjs'
    - 'keycharm'
    - 'vis-data'
    - 'vis-util'

# Security overrides — ONLY entries that change the resolved tree. EMPTY since 12.1.0, and written as
# `{}` so `check:overrides` reads it as a decision rather than as a parse failure.
#
# They do NOT reach consumers of the published package: `overrides:` is honoured only for the ROOT
# project of an install. A green `pnpm audit` here says nothing about a consumer's tree, which is why
# docs/security-overrides.md (shipped via `docs/**`) tells projects which entries to mirror.
#
# The last two entries left on 2026-10-29 (nest-server 12.1.0), because both upstream exact pins they
# lifted moved past their advisories: @nestjs/graphql 14.1.0 pins @graphql-tools/utils 12.1.0
# (GHSA-c4qx-w738-7hr3, patched >=12.0.2) and @nestjs/platform-express 12.3.2 pins multer 2.5.0
# (GHSA-q7qp-rjg7-q26m, patched >=2.5.0). Two FRESH resolves of the final dependency set, one with
# and one without the two entries, produced the identical package set and the same audit
# (0 advisories). Re-run that comparison before adding an entry, and on every maintenance run that
# still finds one here: comparing against the committed lockfile hides every effect, because it
# already carries the pinned versions.
#
# Targets are FIXED versions inside the requested major, and key and target move together — see
# .claude/rules/package-management.md ("Override Targets MUST Be Fixed Versions", "Overrides AGE").
overrides: {}

# Supply-chain hold-back: never resolve a version published less than a day ago, so a compromised
# release has time to be detected and unpublished. pnpm 11's own default, set explicitly so the policy
# cannot change silently with the tool.
minimumReleaseAge: 1440

# Exact versions exempted from the hold-back. `pnpm audit --fix` writes a security fix here so it can
# be installed the same day. Keep it empty otherwise: every entry names one exact version and goes dead
# the moment that version stops resolving.
minimumReleaseAgeExclude: []
