# pnpm settings (single source of truth).
# pnpm 11 no longer reads the "pnpm" field in package.json, and .npmrc is auth/registry only
# (https://pnpm.io/blog/releases/11.0). Everything pnpm-specific lives here.

# Migrated from .npmrc (pnpm 11 no longer reads these from .npmrc):
nodeLinker: hoisted
autoInstallPeers: false
strictPeerDependencies: false

# Packages allowed to run install scripts (native builds). pnpm 11 merges the old
# onlyBuiltDependencies/neverBuiltDependencies into this single allowBuilds map.
allowBuilds:
  'bcrypt': true
  '@swc/core': true
  'esbuild': true
  '@nestjs/core': true
  '@compodoc/compodoc': true
  '@apollo/protobufjs': true
  '@scarf/scarf': false
  # Optional native accelerator for msgpackr (via bullmq); pure-JS fallback works fine.
  'msgpackr-extract': false

# ----------------------------------------------------------------------------------
# Advisories we knowingly do NOT fix, with the reason. `pnpm audit` treats these as
# resolved, so the CI gate stays meaningful for everything else.
# Rules for adding one: name the advisory, say why it cannot be fixed, say why the
# residual risk is acceptable, and date the verification. If you cannot write those
# three sentences honestly, fix the dependency instead.
# ----------------------------------------------------------------------------------
auditConfig:
  # Empty on purpose — see below before adding anything here.
  #
  # This list held GHSA-mh99-v99m-4gvg (brace-expansion DoS, HIGH) from 2026-07-28
  # until 2026-09-03, with a careful justification: at the time the newest 1.x was
  # 1.1.16 and carried no length guard, so the one remaining path
  #   @nestjs/cli > fork-ts-checker-webpack-plugin > minimatch@3 > brace-expansion@1
  # had nowhere to move to. Substituting minimatch@10 there throws
  # "minimatch_1.default is not a function"; forcing brace-expansion@5.0.8 under
  # minimatch@3 throws "expand is not a function". All of that was true and stayed true.
  #
  # What changed is the world, not the analysis: 1.1.17 — the backport the entry
  # said did not exist — was published on 2026-07-29, ONE DAY after the check.
  # 1.1.18 followed on 07-30, and the `brace-expansion@<1.1.18 -> 1.1.18` override
  # above has been quietly resolving that path to a patched version ever since.
  # `pnpm why` confirms it: minimatch@3.1.5 now pulls brace-expansion@1.1.18, and
  # minimatch@10.2.6 pulls 5.0.9. Both are above their fix lines.
  #
  # THE LESSON IS THE ENTRY, NOT THE PACKAGE. A suppression is removed from
  # `pnpm audit --json` entirely — `advisories` drops it, `muted` comes back empty —
  # so no audit run ever mentions it again. This one was obsolete for five weeks and
  # nothing said so; it only surfaced when a guard re-checked the GHSA against the
  # GitHub Advisory API. Before adding an entry here, make sure something will tell
  # you when it stops being true.
  ignoreGhsas: []

peerDependencyRules:
  allowedVersions:
    '@apollo/server': '5'
    '@types/express': '5'
  ignoreMissing:
    - '@egjs/hammerjs'
    - 'keycharm'
    - 'vis-data'
    - 'vis-util'

# Security overrides: force vulnerable transitive deps onto patched versions.
#
# WARNING — these do NOT reach consumers of the published package. `overrides:` is honoured only
# for the ROOT project of an install, so a downstream project gets ITS OWN overrides, not these.
# A green `pnpm audit` here says nothing about a consumer's tree. The load-bearing entries are
# therefore mirrored in nest-server-starter and lt-monorepo, and documented for hand-rolled setups
# in docs/security-overrides.md (which ships, because `docs/**` is in package.json `files`).
#
# Last verified 2026-08-22 by resolving TWO fresh lockfiles - one with this block, one without -
# and diffing the resolved versions. Do it that way: comparing against the committed lockfile
# hides every effect, because that lockfile already carries the pinned versions.
#   LOAD-BEARING - removing them reintroduces a vulnerable or unpatched version:
#     brace-expansion (2.x line returns), minimatch (9.0.9 returns), hono (SDK's ^4.11.4 alone
#     does not reach the advisories), axios + ip-address (their keys are what lift the parent
#     ranges onto the patched line)
#   INERT today - each already resolves to a patched version without help, and each target is at
#   the latest release in its major, so none is currently holding anything back. Kept as cheap
#   insurance against a parent re-pinning downwards. Re-check every maintenance run:
#     ws, js-yaml x2, fast-uri, nanoid, postcss, undici, body-parser
#
# DOWNGRADE-LOCK is the failure mode to hunt for here, and the 2026-08-22 run found three of them
# (axios, ip-address, hono). A key is matched against the REQUESTED RANGE, not the resolved
# version, so even a "floored" key replaces the parent's whole spec. An entry therefore stops
# being harmless the moment its target falls behind the newest release in the major - check every
# target against `npm view <pkg> versions` each run, and raise the target and the key together.
#
# Every target MUST be a fixed version, never an unbounded range - see
# .claude/rules/package-management.md for the incident that rule exists to prevent.
# pnpm 11 `pnpm audit` is the safety net for regressions.
overrides:
  # Security: qs — two MODERATE advisories, patched >=6.16.0 (added 2026-09-02)
  #   array-limit bypass via bracket-key comma parsing, and a DoS via attacker-controlled isBuffer
  # RUNTIME: qs is how Express parses query strings, so it is on the request path of every route.
  # That also makes it load-bearing for a security property this release depends on — the extended
  # parsing is what lets `?token[$ne]=` arrive as an object, which the new `isQueryableString`
  # guards reject. Same major, so this is a plain patch lift.
  # Remove once express/body-parser floor it themselves.
  'qs@<6.16.0': '6.16.0'
  # Security: Memory exhaustion DoS + uninitialized memory disclosure (GHSA-96hv-2xvq-fx4p, high, patched >=8.21.0) - transitive via @nestjs/graphql>ws and @nestjs/graphql>graphql-ws>ws (resolves to vulnerable 8.20.1 without this)
  # NO LONGER LOAD-BEARING as of 2026-08-19: @nestjs/graphql 13.4.5 pins `ws: 8.21.3` itself
  # (13.4.2 pinned the vulnerable 8.20.1), and graphql-ws 6.2.1 takes ws as an optional peer. Every
  # 8.x consumer in the tree now requests 8.21.3 unaided, so this entry has flipped to a pure pin.
  # KEPT anyway, and safely: the key is RANGE-FLOORED (`<8.21.0`, i.e. it stops below the target),
  # so it can only ever lift a vulnerable version up and can never drag a newer patch back down -
  # it is not the downgrade-lock shape the header warns about. It is cheap insurance against a
  # future @nestjs/graphql patch re-pinning an older ws.
  # Target raised 8.21.1 -> 8.21.3 on 2026-08-10 to match the direct `ws` dependency: with
  # nodeLinker: hoisted a lower target would leave a SECOND, older ws copy in the tree next to
  # the direct one. Keep the two in lockstep whenever the direct dependency moves.
  # Remove once ws 8.x is no longer reachable at all, or once @nestjs/graphql floors it in a range.
  # Security: browserslist — two HIGH advisories, both patched >=4.28.7 (added 2026-09-01)
  #   GHSA-c83g-rgw3-j3cx  unbounded memory growth: the query cache has no eviction, so distinct
  #                        queries accumulate until OOM
  #   GHSA-73wf-gq98-2v4g  uncaught crash / prototype write via an untrusted
  #                        browserslist-stats.json in normalizeStats()
  # BUILD-TIME ONLY. All three paths are devDependencies — @nestjs/cli>webpack,
  # @nestjs/cli>fork-ts-checker-webpack-plugin>webpack, unplugin-swc>unplugin>webpack — so nothing
  # here reaches a consumer's runtime, and neither advisory is reachable from untrusted input in a
  # build: the queries come from our own browserslist config and there is no stats file. Pinned
  # anyway rather than accepted, because the fix costs one line and "unreachable today" is a
  # property of the current build graph, not a guarantee about the next one.
  # Key is RANGE-FLOORED, so it can only lift a vulnerable version and never drag a newer patch
  # down. Target is 4.28.8, the latest in the line — see the header note on downgrade-locks.
  # Remove once webpack requests >=4.28.7 itself.
  'browserslist@<4.28.7': '4.28.8'
  'ws@>=8.0.0 <8.21.0': '8.21.3'
  # Security: Axios formDataToJSON recursion DoS + prototype pollution in auth subfields (3x moderate, patched >=1.18.0) - transitive via node-mailjet>axios (@getbrevo/brevo dropped all runtime deps in v6)
  # Target raised 1.18.1 -> 1.19.0 on 2026-08-22, and the key upper bound with it. NOT cosmetic: an
  # override key matches the REQUESTED RANGE, not the resolved version, so `axios@<1.18.0` still
  # matched node-mailjet's `^1.x` and replaced the whole spec - holding axios at 1.18.1 while a
  # clean resolve gives 1.19.0. A "floored" key does NOT make an entry downgrade-proof; only a
  # target at the latest release in the major does. Verified 2026-08-22 by diffing two fresh
  # lockfile resolves (with/without this block).
  # Remove once node-mailjet requests >=1.18.0 itself.
  'axios@<1.19.0': '1.19.0'
  # Security: brace-expansion DoS - two advisories. GHSA-3jxr-9vmj-r5cp (exponential-time expansion of
  # consecutive non-expanding {} groups) and GHSA-mh99-v99m-4gvg (unbounded expansion length -> OOM).
  # CORRECTED 2026-09-03: this comment used to read "patched ONLY in 5.0.8; verified 2026-07-28 that
  # 1.1.16 and 2.1.2 carry no length guard at all". That was true when written and stopped being true
  # the following DAY - the Advisory API lists fix lines per major: 1.x -> 1.1.17, 2.x -> 2.1.3,
  # 3.x -> 3.0.3, 4/5.x -> 5.0.8, none withdrawn. The "only 5.0.8" reading is what justified the
  # suppression that then sat obsolete for five weeks (see auditConfig at the top of this file).
  # One entry per affected major, each a patch bump INSIDE that major.
  # v5 (prod): ts-morph>@ts-morph/common>minimatch, directly and via @nestjs/graphql + @nestjs/apollo. v2/v1 (dev only): @nestjs/cli + @swc/cli > minimatch, @nestjs/cli>fork-ts-checker-webpack-plugin>minimatch.
  # The v5 key is floored at >=5.0.0 on purpose: a wider `>=3.0.0` would ALSO match a future 3.x/4.x
  # dependency and silently force it across two majors - which is not what "patch bump" means.
  # Inert today (all three resolve patched). Remove once minimatch requests the patched ranges.
  'brace-expansion@>=5.0.0 <5.0.9': '5.0.9'
  # The 2.x line no longer resolves at all since the minimatch lift below removed its only parent.
  # Kept anyway, and deliberately: it is not inert because the dependency was fixed, but because
  # ANOTHER override happens to hide it. Drop the minimatch entry and 2.x returns immediately, so
  # deleting this one would couple two unrelated lines. Remove it once minimatch@9 is gone for good.
  # Target raised 2.1.2 -> 2.1.4 on 2026-09-03. NOT cosmetic: the 2.x fix line for
  # GHSA-mh99-v99m-4gvg is 2.1.3, so the old target pinned this line one patch BELOW its own
  # advisory - the "stale override" shape `pnpm run check:overrides` now catches. Latent rather
  # than exploitable, since nothing resolves in 2.x today; raised so it cannot become live silently.
  'brace-expansion@>=2.0.0 <2.1.4': '2.1.4'
  'brace-expansion@<1.1.18': '1.1.18'
  # Security: the real lever for GHSA-mh99-v99m-4gvg. Only brace-expansion 5.0.8 carries the fix, and
  # forcing it onto a minimatch@3 consumer throws "expand is not a function" (5.x exports a namespace
  # object, not a callable). minimatch 10.2.6 REQUESTS ^5.0.8, so lifting every 9.x consumer onto it
  # removes the vulnerable 2.x line from the tree legitimately.
  # Floored at >=9.0.0, NOT >=5.0.0: only 9 and 10 share the non-callable CJS export shape. Verified
  # 2026-07-30 that majors 5-8 export a CALLABLE function (5.1.6: `typeof m === 'function'`; 6-8 add a
  # `.default`), so forcing them onto 10 would throw the very "is not a function" documented below as
  # the reason minimatch@3 is excluded. Nothing resolves in 5-8 today, so the wider floor was latent
  # rather than broken - but it pre-authorized exactly the break it warns about.
  # minimatch@3 is deliberately NOT matched: substituting minimatch@10 there throws
  # "minimatch_1.default is not a function" (fork-ts-checker calls it via __importDefault).
  # That path is fine anyway - the `brace-expansion@<1.1.18` entry above lifts its
  # brace-expansion to 1.1.18, past the 1.x fix line of 1.1.17. This used to say
  # "see auditConfig above", which now points at an empty `ignoreGhsas: []`.
  'minimatch@>=9.0.0 <10.2.6': '10.2.6'
  # Security: js-yaml quadratic CPU consumption via YAML merge-key chains (GHSA-52cp-r559-cp3m, high, patched >=4.3.0) - dev only, transitive via @compodoc/compodoc>cosmiconfig and @nestjs/cli>fork-ts-checker-webpack-plugin>cosmiconfig
  # Inert today. Remove once cosmiconfig requests >=4.3.0.
  'js-yaml@>=4.0.0 <4.3.1': '4.3.1'
  # Security: js-yaml exponential parsing time in flow collections (GHSA-pm4m-ph32-ghv5, high, patched >=5.2.2) - transitive via @nestjs/swagger>js-yaml. Separate line from the 4.x entry above: same package, different major.
  'js-yaml@>=5.0.0 <5.2.2': '5.2.2'
  # Security: fast-uri - SIX advisories now, all four newest patched >=3.1.6 (raised 2026-09-02)
  #   GHSA-v2hh-gcrm-f6hx  host confusion via failed IDN canonicalization        (>=3.1.3)
  #   (unnamed)            literal backslash authority delimiter                 (>=3.1.4)
  #   GHSA-5jgf-p345-68v8  host confusion, skipped IDN canonicalization on
  #                        scheme-relative references                            (>=3.1.6)
  #   GHSA-f65p-4m7j-42xc  SSRF via malformed IPv6 normalization                 (>=3.1.6)
  #   GHSA-4mjr-xmp4-gh2g  SSRF via repeated hostname percent-decoding           (>=3.1.6)
  #   (+1 sibling)                                                              (>=3.1.6)
  # THIS ENTRY WAS THE THING KEEPING THE TREE VULNERABLE. It floored at `<3.1.5` for the two 2026-08
  # advisories, so once the four newer ones landed it actively PINNED matching paths at 3.1.5 -
  # below the new patch line. Adding a second, higher entry does not help: the narrower floor still
  # claims its paths first, and the tree ends up carrying both versions. A superseded override is
  # not inert, it is a lock; raise the existing one rather than stacking a new one beside it.
  # RUNTIME, not build-time - the difference from the browserslist entry below. It arrives through
  # `@modelcontextprotocol/sdk`, a direct `dependency` (not an optional peer), so every consumer of
  # this package carries it in the production tree. @compodoc/compodoc pulls a second copy at build
  # time; both are covered.
  # Target 3.1.6, not the newer 3.1.7: this repo enforces a `minimumReleaseAge` policy and 3.1.7 was
  # published inside that window - the install refuses it outright. Taking the oldest version that
  # clears every advisory is the right instinct regardless.
  # Pinned WITHIN the 3.x major; 4.x exists, and crossing a major to fix a transitive advisory is
  # the shape that broke a project in April 2026 (see package-management.md).
  # Remove once ajv floors it - ajv is the only importer in all 38 paths.
  'fast-uri@<3.1.6': '3.1.6'
  # Security: ip-address ReDoS + parser confusion (high + moderate, patched >=10.3.1) - dev/transitive
  # via @modelcontextprotocol/sdk>express-rate-limit>ip-address.
  # Target raised 10.3.1 -> 10.5.0 on 2026-08-22 (key upper bound with it): the old entry pinned
  # ip-address two minors behind the 10.5.0 a clean resolve gives - see the axios entry above for
  # why a floored key is not enough on its own.
  # Remove once express-rate-limit requests >=10.3.1.
  'ip-address@<10.5.0': '10.5.0'
  # Security: TWO advisories on the 3.x line — predictable output with a non-integer size
  # (patched >=3.3.17) and, since 2026-08, custom generators looping indefinitely when size
  # is zero (high, patched >=3.3.18). The target is the LATER of the two; a 3.3.17 target
  # closes the first and leaves the second open. Dev only,
  # transitive via better-auth>vitest>vite>postcss>nanoid. Separate line per major: 5.x is unaffected.
  # Remove once postcss requests >=3.3.17.
  'nanoid@>=3.0.0 <3.3.18': '3.3.18'
  # Security: postcss parsing DoS (moderate, patched >=8.5.23) - dev only, transitive via
  # better-auth>vitest>vite>postcss. Remove once vite requests >=8.5.23.
  'postcss@<8.5.23': '8.5.23'
  # Security: undici request smuggling / header handling (moderate, patched >=7.29.0) - dev only,
  # transitive via @compodoc/compodoc>cheerio>undici. Remove once cheerio requests >=7.29.0.
  'undici@>=7.0.0 <7.29.0': '7.29.0'
  # Security: hono path handling + body-limit bypass (moderate + low, patched >=4.12.34) - transitive
  # via @modelcontextprotocol/sdk>hono and >@hono/node-server>hono. Floored at >=4.0.0 so the entry
  # stays a patch bump inside major 4 and cannot drag a future 5.x across a major.
  # KEEP THIS ENTRY - see the hono note below for the earlier form that was removed and why this
  # one is not it. Remove only once the SDK requests >=4.12.34 itself.
  # Target raised 4.12.34 -> 4.13.3 on 2026-08-22, key upper bound with it: the old entry matched
  # the SDK's `^4.11.4` and replaced it, holding hono a minor behind the 4.13.3 a clean resolve
  # gives. See the axios entry for the general form of this trap.
  'hono@>=4.0.0 <4.13.3': '4.13.3'
  # Security: body-parser DoS on malformed urlencoded input (GHSA-v422-hmwv-36x6, low, patched >=2.3.0) - transitive via @apollo/server, @as-integrations/express5 and express itself (22 paths)
  # Inert today. Remove once express / @apollo/server request >=2.3.0.
  'body-parser@>=2.0.0 <2.3.0': '2.3.0'
  # NOTE on the `hono` override above - read this BEFORE deleting it.
  # There IS a hono override now, and it is load-bearing. What is forbidden is the EARLIER form:
  # a bare `hono: '4.12.27'` (or any key whose range extends at or above the target). pnpm replaces
  # the whole matched spec with the target, so such an entry is a HARD PIN - it dragged hono BACK
  # four patch releases from the 4.12.31 the SDK resolved on its own, silently reintroducing
  # everything fixed in 4.12.28-4.12.31. That shape must not come back.
  # CORRECTION 2026-08-22: the claim that used to stand here - that a RANGE-FLOORED key "can only
  # ever lift a vulnerable version up and never pulls a newer one down" - is FALSE, and believing it
  # cost three entries (axios, ip-address, hono) a silent hold-back. An override key is matched
  # against the REQUESTED RANGE a parent declares, not against the version that would resolve. The
  # SDK's `^4.11.4` intersects `<4.12.34`, so the floored key matched and replaced the whole spec,
  # pinning hono at the target while a clean resolve gave 4.13.3. Flooring the key bounds the
  # BLAST RADIUS (it cannot drag a future 5.x across a major) but it does NOT make the entry
  # downgrade-proof. The only thing that does is keeping the TARGET at the latest release in the
  # major - so every raise must move the target and the key upper bound together, and every
  # maintenance run must re-check the targets against `npm view <pkg> versions`.
  # Method that shows it: resolve two fresh lockfiles, one with this block and one without, and
  # diff the resolved versions. Reusing the committed lockfile hides the effect, because it already
  # carries the pinned versions.
  # The hono entry is still required for the three moderate advisories (GHSA-xgm2-5f3f-mvvc,
  # GHSA-hvrm-45r6-mjfj, GHSA-w62v-xxxg-mg59) plus the 4.12.34 path-handling and body-limit fixes,
  # which the SDK's `^4.11.4` does not reach on its own.
  #
  # REMOVED 2026-08-22: '@hono/node-server@<2.0.10': '2.0.11'
  # Its own documented removal condition - "drop this entry as soon as @modelcontextprotocol/sdk
  # moves its own range to ^2" - is now met. SDK 1.30.0 declares `^1.19.9 || ^2.0.5`, and a fresh
  # resolve WITHOUT the override picks 2.1.1, i.e. above the 2.0.10 that fixes GHSA-9mqv-5hh9-4cgg
  # (memory leak) and well above the 2.0.5 that fixes GHSA-frvp-7c67-39w9 (static-file path
  # traversal). Keeping it would have held the package at 2.0.11 for no benefit. The old comment's
  # "regresses to 1.19.14" is stale - that was true while the SDK declared ^1.19.9 alone.

# Supply-chain hold-back: do not resolve a version published less than a day ago, so a compromised
# release has time to be detected and unpublished before it can enter this lockfile.
#
# CORRECTION of an earlier note here, which claimed the hold-back was off and the exclusion list
# below therefore inert. It is not - pnpm 11 turned this ON BY DEFAULT. Verified against the pinned
# pnpm 11.13.1 dist: its default config map contains `"minimum-release-age": 24 * 60`, and the
# 11.0.0 changelog states "`minimumReleaseAge` is now `1440` (1 day) ... To opt out, set
# `minimumReleaseAge: 0`". (The `?? 0` fallback that note quoted is a downstream default inside a
# helper, not the config default.) The list below is live, and deleting an entry from it can break
# an install. The entry comments prove it independently: the AWS SDK pair is carried "because it
# always trips a hold-back" - which is not something an inactive policy can do.
#
# Set EXPLICITLY rather than inherited, for the same reason every dependency here carries a fixed
# version: a security policy that silently changes when the tool changes its default is not a policy.
# 1440 minutes = 1 day = pnpm 11's own default, so this pins today's behaviour and changes nothing.
minimumReleaseAge: 1440

# Versions exempted from the hold-back above. Two sources feed this list:
#   - `pnpm audit --fix` writes the minimum patched version of an advisory here, so a security fix
#     can be installed without waiting out the day;
#   - an install that must resolve a fresh version (a same-day dependency bump) records it here.
# Every entry is an EXACT version, so an exemption can never widen to a later release.
minimumReleaseAgeExclude:
  # Cleared 2026-08-22: the AWS SDK pair (3.1112.0) and bullmq (6.1.2) were bumped to 3.1115.0 and
  # 6.2.0, and all three of those releases are already older than the 1440-minute hold-back, so no
  # exemption is needed to install them. Superseded exemptions are removed rather than carried:
  # each one names an EXACT version, so it goes dead the moment that version stops resolving, and a
  # dead entry reads like a live waiver of the supply-chain policy. Re-add one only when an install
  # genuinely cannot resolve without it.
  - '@nestjs/common@11.2.1'
  - '@nestjs/core@11.2.1'
  - '@nestjs/platform-express@11.2.1'
